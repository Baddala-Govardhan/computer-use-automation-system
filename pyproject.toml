[project]
name = "computer-use-automation"
version = "0.1.0"
description = "Computer-use discovery agent + deterministic replay engine for legacy back-office UIs"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "playwright>=1.42",
    "groq>=0.11",
    "pyyaml>=6.0",
    "flask>=3.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*", "agent*", "replay*", "escalation*", "mock_bank_app*"]
